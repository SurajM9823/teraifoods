# Standalone deployment file, NOT an override of compose.yaml.
name: terai-food-production

x-app: &app
  image: terai-food:${APP_TAG:-production}
  build: .
  env_file: ${APP_ENV_FILE:-.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_TRUST_PROXY: "true"
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_SSLMODE: disable
    HEALTHCHECK_HOST: ${NGINX_HOST:?Set NGINX_HOST in .env.production}
    ALLAUTH_TRUSTED_PROXY_COUNT: "1"
    REDIS_CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CHANNEL_REDIS_URL: redis://redis:6379/2
  volumes:
    - static_files:/app/staticfiles
    - media_files:/app/media
  networks:
    - backend

services:
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=WARNING", "--schedule=/tmp/order-beat"]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=WARNING", "--concurrency=2", "--max-tasks-per-child=200"]
    networks:
      - backend
      - edge
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terai_food}
      POSTGRES_USER: ${POSTGRES_USER:-terai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  init:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    networks:
      - backend
      - edge
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    environment:
      NGINX_HOST: ${NGINX_HOST:?Set NGINX_HOST in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/proxy_params_terai.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    networks:
      - backend
      - edge
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  static_files:
  media_files:
