<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48" fill="none">
  <!-- Icon: Leaf and grocery sprout -->
  <g transform="translate(2, 4)">
    <!-- Grocery basket base / shield -->
    <rect x="2" y="14" width="34" height="24" rx="7" fill="#634C9F"/>
    <path d="M7 14L11 6C12 4 14 3 16 3H22C24 3 26 4 27 6L31 14" stroke="#634C9F" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Organic leaves sprouting -->
    <path d="M19 12C19 6 24 2 30 2C30 8 26 12 19 12Z" fill="#10B981"/>
    <path d="M19 12C19 7 15 4 10 5C9 10 13 13 19 12Z" fill="#34D399"/>
    
    <!-- Food sparkle / sun -->
    <circle cx="19" cy="24" r="4.5" fill="#FFD200"/>
    <circle cx="19" cy="24" r="2.5" fill="#FFFFFF"/>
    
    <!-- Accent lines on basket -->
    <line x1="10" y1="23" x2="10" y2="31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
    <line x1="28" y1="23" x2="28" y2="31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  </g>

  <!-- Brand Typography -->
  <text x="48" y="29" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="#2E1065">terai<tspan fill="#10B981">food</tspan></text>
  <text x="49" y="41" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" letter-spacing="2.2" fill="#8B5CF6">FRESH GROCERY STORE</text>
</svg>

