{% load static %}
<div class="shop-product-card" data-category="{{ product.category.legacy_key|default:product.category.slug }}" data-price="{{ product.price }}" data-rating="4.9" data-name="{{ product.name }}" data-catalog-product="{{ product.pk }}" data-available="{{ product.available|yesno:'true,false' }}" data-product-url="/product-detail/?product={{ product.slug }}">
								<div class="card-wrapper">
									<div class="thumbnail-wrapper">
										<span class="badge-discount">{{ product.discount_percent }}%</span>
										<div class="thumbnail-buttons action-buttons-vertical" style="position: absolute !important; top: 8px !important; right: 8px !important; left: auto !important; bottom: auto !important; display: flex !important; flex-direction: column !important; align-items: center !important; gap: 6px !important; z-index: 10 !important; width: 32px !important; margin: 0 !important; padding: 0 !important;">
<div class="wishlist-button" style="display: flex !important; width: 32px !important; height: 32px !important; margin: 0 !important; padding: 0 !important; order: 1 !important;"><a href="#wishlist" class="klbwl-btn klbwl-btn-{{ product.pk }}" data-product_id="{{ product.pk }}" data-name="{{ product.name }}" title="Add to wishlist" aria-label="Add to wishlist" style="display: flex !important; align-items: center !important; justify-content: center !important; width: 32px !important; height: 32px !important; min-width: 32px !important; min-height: 32px !important; border-radius: 50% !important; background: #ffffff !important; box-shadow: 0 2px 6px rgba(0,0,0,0.12) !important; border: 1px solid rgba(0,0,0,0.08) !important; font-size: 0 !important; line-height: 1 !important; text-decoration: none !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; cursor: pointer !important;"><svg class="heart-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: block !important; stroke: currentColor !important; pointer-events: none !important;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a></div>
<div class="compare-button" style="display: flex !important; width: 32px !important; height: 32px !important; margin: 0 !important; padding: 0 !important; order: 2 !important;"><a href="#compare" class="klbcp-btn klbcp-btn-{{ product.pk }}" data-id="{{ product.pk }}" data-product_id="{{ product.pk }}" data-name="{{ product.name }}" title="Compare" aria-label="Compare" style="display: flex !important; align-items: center !important; justify-content: center !important; width: 32px !important; height: 32px !important; min-width: 32px !important; min-height: 32px !important; border-radius: 50% !important; background: #ffffff !important; box-shadow: 0 2px 6px rgba(0,0,0,0.12) !important; border: 1px solid rgba(0,0,0,0.08) !important; font-size: 0 !important; line-height: 1 !important; text-decoration: none !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; cursor: pointer !important;"><svg class="compare-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: block !important; stroke: currentColor !important; pointer-events: none !important;"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></a></div>
</div><!-- thumbnail-buttons -->
										<div class="product-thumbnail"><a href="/product-detail/?product={{ product.slug }}"><picture><source type="image/avif" srcset="{{ product.main_image.avif_srcset }}" sizes="(max-width: 500px) 50vw, 250px"><source type="image/webp" srcset="{{ product.main_image.webp_srcset }}" sizes="(max-width: 500px) 50vw, 250px"><img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy"></picture></a>
										</div>
									</div>
									<div class="content-area">
										<div>
											<span class="tag-badge himalayan"><i class="klb-icon-shield-check"></i> AGED GRAIN</span>
										</div>
										<h2 class="product-title"><a href="/product-detail/?product={{ product.slug }}">{{ product.name }}</a></h2>
										<div class="rating-row">
											<div class="star-rating" role="img" aria-label="Rated 4.90 out of 5"><span style="width:98%">Rated 4.90</span></div>
											<span class="review-count">96</span>
										</div>
										<div class="price-row">
											<span class="sale-price">&pound;{{ product.price }}</span>
											<del class="regular-price">{% if product.sale_price %}&pound;{{ product.regular_price }}{% endif %}</del>
										</div>
										<a href="?add-to-cart={{ product.pk }}" class="btn-cart-pill add_to_cart_button" data-product_id="{{ product.pk }}">
											<span>Add to cart</span>
											<span class="plus-symbol">+</span>
										</a>
									</div>
								</div>
							</div>
