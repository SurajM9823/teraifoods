limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=customer_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=site_traffic:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=client_connections:10m;

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn client_connections 30;
    limit_conn_status 429;
    limit_req_status 429;

    location ^~ /accounts/ {
        client_max_body_size 32k;
        limit_req zone=customer_auth burst=20 nodelay;
        # Do not record OAuth authorization codes in access logs.
        access_log off;
        include /etc/nginx/proxy_params_terai.conf;
    }

    location /static/ {
        alias /var/www/static/;
        autoindex off;
    }

    location ~ ^/admin/(login/?|system/login/?)$ {
        limit_req zone=admin_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_terai.conf;
    }

    location / {
        limit_req zone=site_traffic burst=40 nodelay;
        set $upstream_backend http://web:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
