{% if cms_home.banners %}
<div class="klb-slider site-slider slider-style slider-loading-height loader-default arrows-default arrows-offset" data-speed="600" data-items="1" data-itemscroll="1" data-arrows="true" data-dots="true" data-autoplay="" data-auto_speed="" data-infinite="true" data-draggable="true">
{% for banner in cms_home.banners %}
<div class="slider-item"><div class="site-banner overflow-hidden rounded-base" style="--banner-tablet-height: 420px; --banner-mobile-height: 360px;" data-color="dark">
  <div class="entry-wrapper d-flex align-items-start strech p-20 sm-p-40 lg-p-60"><div class="entry-inner max-w-80 sm-max-w-60 md-max-w-50">
    {% if banner.badge %}<div class="entry-header mb-10"><span class="banner-badge green">{{ banner.badge }}</span></div>{% endif %}
    <div class="entry-body mb-10 sm-mb-24 md-mb-40"><h2 class="entry-title text-26 sm-text-36 md-text-42 fw-bold text-primary-active">{{ banner.title }}</h2>
      {% if banner.description %}<div class="entry-content pr-0 md-pr-30"><p class="text-13 sm-text-14 md-text-16 lh-base">{{ banner.description }}</p></div>{% endif %}
    </div>
    <div class="entry-footer d-flex flex-wrap align-items-center gap-3"><a href="{{ banner.destination }}" class="btn btn-primary mobile-small icon-right">{{ banner.button_label }} <i class="klb-icon-move-right" aria-hidden="true"></i></a></div>
  </div></div>
  <div class="entry-media"><img decoding="async" {% if forloop.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %} src="{{ banner.image_url }}" alt="{{ banner.image_alt }}" width="1170" height="548" style="object-fit:cover"></div>
  <a href="{{ banner.destination }}" class="overlay-link" tabindex="-1" aria-hidden="true"></a>
</div></div>
{% endfor %}
</div>
{% endif %}
